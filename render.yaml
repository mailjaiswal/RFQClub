# Render blueprint for the RFQClub API (free tier).
# Neon connection string + a strong AUTH_SECRET are set in the Render dashboard
# (they are not committed). First boot auto-seeds the demo board from
# api/seed_data/rfqs.json — see api/bootstrap.py.
services:
  - type: web
    name: rfqclub-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OTP_MODE
        value: dev
      - key: DATABASE_URL # set to the Neon pooled string in the dashboard
        sync: false
      - key: AUTH_SECRET # generate a strong random value in the dashboard
        sync: false
      - key: GOOGLE_CLIENT_ID # public OAuth client ID (not a secret) for "Continue with Google"
        value: 553353885205-gpjdn704gn0nbj95klij2d8dfopc0i6u.apps.googleusercontent.com
      - key: CORS_ORIGINS # once Vercel deploys, e.g. https://<proj>.vercel.app
        value: http://localhost:3001
      - key: WEB_BASE_URL # origin used to build password-reset links sent by email
        value: https://rfqclub-web.vercel.app
      # Email delivery is optional: with no key set, sign-in codes and reset
      # links are shown on-screen instead (OTP_MODE=dev). Add a RESEND_API_KEY
      # (plus EMAIL_FROM on your verified domain) in the dashboard to send for real.
      - key: RESEND_API_KEY # https://resend.com/api-keys
        sync: false
      - key: EMAIL_FROM # e.g. RFQClub <no-reply@yourdomain.com>
        sync: false
