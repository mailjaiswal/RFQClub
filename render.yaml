# Render blueprint for the RFQClub API (free tier).
# Neon connection string + a strong AUTH_SECRET are set in the Render dashboard
# (they are not committed). First boot auto-seeds the demo board from
# api/seed_data/rfqs.json — see api/bootstrap.py.
services:
  - type: web
    name: rfqclub-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OTP_MODE
        value: dev
      - key: DATABASE_URL # set to the Neon pooled string in the dashboard
        sync: false
      - key: AUTH_SECRET # generate a strong random value in the dashboard
        sync: false
      - key: GOOGLE_CLIENT_ID # public OAuth client ID (not a secret) for "Continue with Google"
        value: 553353885205-gpjdn704gn0nbj95klij2d8dfopc0i6u.apps.googleusercontent.com
      - key: CORS_ORIGINS # explicit origins; extend CORS_ORIGIN_REGEX for wildcards
        value: http://localhost:3001,https://rfqclub.swaniki.com,https://swaniki.com,https://www.swaniki.com
      # Broad allowlist so the custom swaniki.com domain (and any future
      # Vercel/Render preview URL) can call the API cross-origin without a
      # config edit for every host. Keep this in sync with api/config.py.
      - key: CORS_ORIGIN_REGEX
        value: '^(https://[\w.-]+\.vercel\.app|https://[\w.-]+\.onrender\.com|https://([\w-]+\.)?swaniki\.com|http://localhost:\d+|http://127\.0\.0\.1:\d+)$'
      - key: WEB_BASE_URL # origin used to build password-reset links sent by email
        value: https://rfqclub.swaniki.com
      # Email delivery is optional: with no key set, sign-in codes and reset
      # links are shown on-screen instead (OTP_MODE=dev). Add a RESEND_API_KEY
      # (plus EMAIL_FROM on your verified domain) in the dashboard to send for real.
      - key: RESEND_API_KEY # https://resend.com/api-keys
        sync: false
      - key: EMAIL_FROM # e.g. RFQClub <no-reply@yourdomain.com>
        sync: false
      - key: OPERATOR_EMAILS # comma-separated allowlist for the concierge /operator role
        sync: false # unset = any signed-in account may self-claim it (demo); set it to lock the review gate
      # Inside-sales CONSOLE (/console + /api/sales/*) is now DB-MANAGED: the
      # first manager is auto-seeded on startup from SALES_ADMIN_EMAIL below, and
      # every further account is created by that manager from the console's
      # Team & access panel. Nothing here is required to open it — leave the
      # legacy allowlists empty. The seeded account is flagged must-change, so
      # SALES_ADMIN_PASSWORD is only a throwaway starter secret rotated on login.
      - key: SALES_ADMIN_EMAIL # first inside-sales manager, seeded once (idempotent)
        value: mail.jaiswal@gmail.com
      - key: SALES_ADMIN_NAME
        value: Admin
      - key: SALES_ADMIN_PASSWORD # starter password; set a private value in the dashboard to override the code default
        sync: false
      # Console owners by email, independent of the single `role` column. The seeded
      # admin already exists on the marketplace as `operator`, so this allowlist is
      # what grants console/manager access without stripping that role. Defaults to
      # SALES_ADMIN_EMAIL if left unset.
      - key: CONSOLE_ADMIN_EMAILS
        value: mail.jaiswal@gmail.com
      # Legacy env allowlists — no longer consulted by require_sales (kept harmless).
      - key: SALES_EMAILS
        sync: false
      - key: SALES_MANAGER_EMAILS
        sync: false
      # AI ingestion (the console "paste anything" box). Set the key in the
      # dashboard; with none present the feature returns a clear 503 instead of
      # failing silently. Gemini is primary; the LLM_* OpenAI vars below are an
      # optional fallback provider.
      - key: GEMINI_API_KEY # https://aistudio.google.com/apikey
        sync: false
      - key: LLM_ENABLED
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
